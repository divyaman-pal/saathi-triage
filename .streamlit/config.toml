# NHS design system palette, so the deployed app matches the local one.
# service-manual.nhs.uk/design-system/styles/colour
[theme]
base = "light"
primaryColor = "#005eb8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f5"
textColor = "#212b32"
font = "sans serif"

[server]
headless = true
# CORS/XSRF are left at their secure defaults. Streamlit Cloud terminates TLS
# and sets origin policy itself, so relaxing them here would weaken the app for
# no benefit. The Dockerfile relaxes XSRF only because HF-style proxies rewrite
# the origin - that is a deployment-specific exception, not the default.

[browser]
gatherUsageStats = false
